[package]
name = "xjctl"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serialport = "4.7"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
